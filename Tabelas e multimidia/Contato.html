<!DOCTYPE html>
<html>
<head>
    <title>Contato - TechConnect</title>
</head>
<body>
 
    <header>
        <h1>TechConnect - Contato</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="servicos.html">Serviços</a> |
            <a href="contato.html">Contato</a>
        </nav>
    </header>

  
    <main>
        <h2>Fale Conosco</h2>
        
        <form action="#" method="get">
          
            <p>
                <label>Nome:</label><br>
                <input type="text" name="nome" size="30" required>
            </p>
            
          
            <p>
                <label>Email:</label><br>
                <input type="email" name="email" size="30" required>
            </p>
            
           
            <p>
                <label>Telefone:</label><br>
                <input type="tel" name="telefone" size="30">
            </p>
            
         
            <p>
                <label>Serviço:</label><br>
                <select name="servico">
                    <option>Site</option>
                    <option>App</option>
                    <option>SEO</option>
                    <option>Outro</option>
                </select>
            </p>
            
   
            <p>
                <label>Mensagem:</label><br>
                <textarea name="mensagem" rows="5" cols="40"></textarea>
            </p>
            
         
            <p>
                <input type="checkbox" name="termos" required>
                <label>Eu aceito os termos</label>
            </p>
            
       
            <p>
                <input type="submit" value="Enviar">
            </p>
        </form>
    </main>

    <footer>
        <p>© 2024 TechConnect</p>
    </footer>
</body>
</html>
